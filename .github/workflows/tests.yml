name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install git+https://github.com/lukaspfisterch/kl-kernel-logic.git
      - run: pip install git+https://github.com/lukaspfisterch/dbl-core.git
      - run: pip install -e .
      - run: python -m pytest -q

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbl-proof
          path: .pytest_cache/v/cache/
