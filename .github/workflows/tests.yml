name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install dependencies
        run: |
          pip install -U pytest
          pip install git+https://github.com/lukaspfisterch/kl-kernel-logic.git
          pip install git+https://github.com/lukaspfisterch/dbl-core.git
          pip install -e .

      - name: Run tests
        run: python -m pytest -q -vv
